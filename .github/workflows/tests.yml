name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terratest:
    name: Terratest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: infra_tests/go.mod
          cache-dependency-path: infra_tests/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require LocalStack token
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "LOCALSTACK_AUTH_TOKEN repository secret is required to run LocalStack tests." >&2
            exit 1
          fi

      - name: Start LocalStack
        run: |
          health_base=$(jq -er '.localstack.gateway' infra/test-backends.json)
          docker compose up -d localstack
          for attempt in {1..60}; do
            if curl --fail --silent "$health_base/_localstack/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs localstack
          exit 1

      - name: Run Go tests
        run: TEST_BACKEND=localstack ./scripts/test-infra.sh

      - name: Stop LocalStack
        if: always()
        run: docker compose down --volumes

  terratest-aws-emulator:
    name: Terratest (AWS Emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: infra_tests/go.mod
          cache-dependency-path: infra_tests/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Run Go tests
        run: TEST_BACKEND=aws-emulator ./scripts/test-infra.sh
